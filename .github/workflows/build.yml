name: build

on:
  push:
    branches: [main]
    tags: ['termux-*', 'uls-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
          # No native armv7 runners: build in an armhf container under
          # qemu-user.  qemu-user can't run ptrace, so the self-test is skipped.
          - arch: armv7
            runner: ubuntu-24.04-arm
            container: arm32v7/ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.container
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm

      - name: Build (native)
        if: ${{ !matrix.container }}
        run: INSTALL_DEPS=1 ./build.sh

      - name: Build (container)
        if: matrix.container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src \
            -e INSTALL_DEPS=1 -e SKIP_SELFTEST=1 \
            ${{ matrix.container }} ./build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proot-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum proot-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Static proot built from the ULS fork of termux/proot ([ItsPhysip/proot](https://github.com/ItsPhysip/proot), \`uls\` branch; changes listed in its ULS-CHANGES.md). The exact commit and build script are in this repository at \`$GITHUB_REF_NAME\`."
            echo
            echo "armv7 is built under qemu-user and has **not** been tested on a device."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            for f in dist/BUILDINFO-*; do
              echo
              echo '```'
              cat "$f"
              echo '```'
            done
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
